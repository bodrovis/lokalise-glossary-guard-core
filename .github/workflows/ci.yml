name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      # v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        
    - name: Set up Go
      # v7.0.0
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: '1.27'
        cache: false
        
    - name: Run tests
      run: go test -shuffle=on -count=1 -race ./... -v -coverprofile=coverage.out

    - uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637
      with:
        token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        files: coverage.out
        strip-prefix: github.com/bodrovis/lokalise-glossary-guard-core/